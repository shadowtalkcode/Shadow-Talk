name: shadow_talk_flutter
description: "Shadow Talk - secure messenger (iOS / Flutter port)."
publish_to: 'none'

version: 2.2.4+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core:
  firebase_auth:
  firebase_database:
  firebase_storage:
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  agora_rtc_engine: ^6.5.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  bluetooth_low_energy: ^6.2.1
  # Pure-Dart Ed25519 / X25519 / SHA-256 — used by the bitchat-compatible
  # offline mesh so packets/announces sign & verify exactly like Android.
  cryptography: ^2.7.0
  # Detect physical device vs simulator so real Firebase phone auth runs only
  # where it can (devices), with a local fallback on the simulator.
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pin the iOS/macOS implementation of path_provider to a CocoaPods-compatible
# release (2.6.0 ships Swift-Package-Manager-only and isn't picked up by our
# CocoaPods build, so getApplicationDocumentsDirectory would fail at runtime).
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans.ttf
        - asset: assets/fonts/open_sans_semibold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
        - asset: assets/fonts/inter_semi_bold.ttf
          weight: 600
