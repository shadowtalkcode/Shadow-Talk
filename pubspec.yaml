name: shadow_talk_flutter
description: "Shadow Talk - secure messenger (iOS / Flutter port)."
publish_to: 'none'

version: 2.2.4+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Voice messages: record audio + play it back (chat voice notes).
  # Pinned to record 4.x (monolithic plugin) — record 5.x is federated and its
  # transitive record_linux pulls an incompatible platform-interface that
  # breaks the iOS kernel compile.
  record: ^4.4.4
  audioplayers: ^6.1.0
  firebase_core:
  firebase_auth:
  firebase_database:
  firebase_storage:
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  agora_rtc_engine: ^6.5.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  bluetooth_low_energy: ^6.2.1
  # Pure-Dart Ed25519 / X25519 / SHA-256 — used by the bitchat-compatible
  # offline mesh so packets/announces sign & verify exactly like Android.
  cryptography: ^2.7.0
  # Detect physical device vs simulator so real Firebase phone auth runs only
  # where it can (devices), with a local fallback on the simulator.
  device_info_plus: ^11.2.0
  # Offline Bitcoin (testnet) wallet — pure-Dart so it builds on iOS without
  # native code. bitcoin_base bundles blockchain_utils, which supplies BIP39
  # (mnemonic/seed) + BIP32 derivation, P2PKH keys/addresses, and raw-
  # transaction build/sign. http = blockstream.info testnet API.
  # Mirrors the Android bitcoinj `offlinebtc` module.
  bitcoin_base: ^7.1.0
  # Bundled with bitcoin_base; imported directly for BIP39 mnemonic/seed and
  # BIP32 key derivation.
  blockchain_utils: ^6.0.0
  http: ^1.2.2
  # QR rendering for the receive address / signed-transaction hand-off.
  qr_flutter: ^4.1.0
  # Fullscreen photo viewer actions: save a chat photo to the device gallery
  # and share it via the OS share sheet (WhatsApp-style).
  gal: ^2.3.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pin the iOS/macOS implementation of path_provider to a CocoaPods-compatible
# release (2.6.0 ships Swift-Package-Manager-only and isn't picked up by our
# CocoaPods build, so getApplicationDocumentsDirectory would fail at runtime).
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans.ttf
        - asset: assets/fonts/open_sans_semibold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
        - asset: assets/fonts/inter_semi_bold.ttf
          weight: 600
